name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./... -coverprofile=coverage-unit.out

  functional:
    name: Functional Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run functional tests
        run: go test ./... -tags functional -coverprofile=coverage-functional.out

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: go test ./... -tags integration -coverprofile=coverage-integration.out

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run e2e tests
        run: go test ./... -tags e2e -coverprofile=coverage-e2e.out

  adapters:
    name: Framework Adapters (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        adapter: [gin, echo, fiber]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: adapters/${{ matrix.adapter }}/go.mod

      - name: Build and test adapter
        working-directory: adapters/${{ matrix.adapter }}
        run: |
          go build ./...
          go vet ./...
          go test ./...
